version: '34'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    networks:
      - kafkanet
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka1
    container_name: kafka1
    depends_on:
      - zookeeper
    networks:
      - kafkanet
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3       # как offsets.topic.replication.factor
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka1:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka2:
      image: confluentinc/cp-kafka:7.4.0
      hostname: kafka2
      container_name: kafka2
      depends_on:
        - zookeeper
      networks:
        - kafkanet
      ports:
        - "9093:9092"
      environment:
        KAFKA_BROKER_ID: 2
        KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
        KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka2:9092'
        KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092'
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3       # как offsets.topic.replication.factor
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3


      healthcheck:
        test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka2:9092"]
        interval: 10s
        timeout: 5s
        retries: 10

  kafka3:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka3
    container_name: kafka3
    depends_on:
      - zookeeper
    networks:
      - kafkanet
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka3:9092'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3       # как offsets.topic.replication.factor
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka3:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - kafkanet
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka1:9092,PLAINTEXT://kafka2:9092,PLAINTEXT://kafka3:9092'
      SCHEMA_REGISTRY_HOST_NAME: 'schema-registry'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
  # FILES WORK!
  # kafka-connect:
  #   image: confluentinc/cp-kafka-connect:7.4.0
  #   hostname: connect
  #   container_name: kafka-connect
  #   depends_on:
