  #     CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
  #     CONNECT_STATUS_STORAGE_TOPIC: 'docker-connect-status'
  #     CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
  #     CONNECT_KEY_CONVERTER: 'org.apache.kafka.connect.storage.StringConverter'
  #     CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
  #     CONNECT_VALUE_CONVERTER: 'io.confluent.connect.avro.AvroConverter'
  #     CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'true'
  #     CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
  #     CONNECT_PLUGIN_PATH: '/usr/share/java,/usr/share/confluent-hub-components,/etc/kafka-connect/jars'
  #   volumes:
  #     - ./plugins:/usr/share/confluent-hub-components
  #     - watched_files:/tmp/
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: debezium
      POSTGRES_PASSWORD: dbz
      POSTGRES_DB: testdb
    networks:
      - kafkanet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debezium -d testdb"]
      interval: 5s
      retries: 10

    command: ["postgres", "-c", "hba_file=/etc/pg_hba.conf", "-c", "config_file=/etc/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/pg_hba.conf
      - ./postgresql.conf:/etc/postgresql.conf

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.4.0
    #hostname: connect
    container_name: kafka-connect
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy

    ports:
      - "8083:8083"
    networks:
      - kafkanet
    environment:
      #BOOTSTRAP_SERVERS: 'kafka1:9092,kafka2:9092,kafka3:9092'
      GROUP_ID: connect-cluster
      CONNECT_BOOTSTRAP_SERVERS: 'kafka1:9092,kafka2:9092,kafka3:9092'
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: 'compose-connect-group'
      CONNECT_CONFIG_STORAGE_TOPIC: 'connector-config'
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_TOPIC: 'connector-offsets'
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_TOPIC: 'connector-status'
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter #org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'true'
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      CONNECT_PLUGIN_PATH: '/usr/share/java,/usr/share/confluent-hub-components,/etc/kafka-connect/jars'
      OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PRODUCER_ACKS: all
    volumes:
      - ./plugins:/usr/share/confluent-hub-components
      #- watched_files:/tmp/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Setup file source connector
  connector-setup:
    image: confluentinc/cp-kafka:7.4.0
    container_name: connector-setup
    depends_on:
      postgres:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./connectors:/connectors
    networks:
      - kafkanet
    command: >
      bash -c "
      echo 'Setting up file source connector...';
      /connectors/setup-connector.sh;
      echo 'Connector setup complete!'"
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors/pg-connector/status"]
      interval: 5s
      retries: 5


  postgre-consumer:
    image: confluentinc/cp-kafka:7.4.0
    container_name: postgre-consumer
    depends_on:
      - connector-setup
       
    networks:
      - kafkanet
    volumes:
      - ./consumer-scripts:/consumer-scripts
    # command: >
    #   bash -c "
    #   echo 'Starting file content consumer...';
    #   kafka-console-consumer --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 \
    #   --topic data.cdc.artyom --property print.key=true --from-beginning"

    command: >
      bash -c "

      echo 'Starting consumer...';
      /consumer-scripts/start-consumer.sh"
    restart: unless-stopped



volumes:
  watched_files:   # объявление именованных томов
  connector:
  pgdata:

networks:
  kafkanet:
    driver: bridge

